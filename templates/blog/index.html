  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
  <style type="text/css">

:root {
   --ink: #111827;
   --text: #374151;
   --muted: #6b7280;
   --line: #e5e7eb;
   --accent: #1d4ed8;
   --bg: #ffffff;
   --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
}

* {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
}

[hidden] {
   display: none !important;
}

html {
   font-size: 18px;
}

body {
   background: var(--bg);
   color: var(--text);
   font-family: var(--serif);
   line-height: 1.5;
   -webkit-font-smoothing: antialiased;
}

a {
   color: inherit;
   text-decoration: none;
}

.wrap {
   max-width: 1080px;
   margin: 0 auto;
   padding: 0 24px;
}

/* Header */

.site-header .wrap {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 1rem;
   min-height: 76px;
}

.brand {
   font-size: 1.5rem;
   font-weight: 700;
   color: var(--ink);
   letter-spacing: -0.01em;
   white-space: nowrap;
}

.site-nav {
   display: flex;
   align-items: center;
   gap: 2.2rem;
   font-size: .9rem;
}

.site-nav a {
   color: var(--ink);
   padding: 8px 0;
   border-bottom: 2px solid transparent;
}

.site-nav a:hover {
   color: var(--accent);
}

.site-nav a[aria-current="page"] {
   color: var(--accent);
   border-bottom-color: var(--accent);
}

.search-toggle {
   display: flex;
   background: none;
   border: 0;
   padding: 4px;
   color: var(--ink);
   cursor: pointer;
}

.search-toggle:hover {
   color: var(--accent);
}

.search-bar {
   padding-bottom: .8rem;
}

.search-bar input {
   width: 100%;
   font: inherit;
   font-size: 1rem;
   color: var(--ink);
   padding: .7rem .9rem;
   border: 1px solid var(--line);
   border-radius: 6px;
   outline: none;
}

.search-bar input:focus {
   border-color: var(--accent);
}

/* Title */

h1 {
   margin: 2.2rem 0 0;
   font-size: clamp(3.2rem, 9vw, 5.4rem);
   font-weight: 700;
   line-height: 1;
   letter-spacing: -0.025em;
   color: var(--ink);
}

/* Posts */

.posts {
   margin: 2.2rem 0 4rem;
}

.post {
   display: grid;
   grid-template-columns: minmax(0, 405px) minmax(0, 1fr);
   gap: 2.6rem;
   padding: 1.4rem 0;
   border-top: 1px solid var(--line);
}

.post:first-child {
   border-top: 0;
}

.thumb img {
   display: block;
   width: 100%;
   aspect-ratio: 5 / 3;
   object-fit: cover;
   border: 1px solid var(--line);
   background: #fafafa;
}

.category {
   margin: .25rem 0 .55rem;
   font-size: .62rem;
   letter-spacing: .28em;
   text-transform: uppercase;
   color: var(--muted);
}

.post h2 {
   font-size: 1.75rem;
   font-weight: 600;
   line-height: 1.18;
   letter-spacing: -0.01em;
   color: var(--ink);
}

.post h2 a:hover {
   color: var(--accent);
}

.meta {
   margin: .55rem 0 .7rem;
   font-size: .9rem;
   color: var(--muted);
}

.meta .sep {
   margin: 0 .55em;
}

.lead {
   color: #4b5563;
}

.more {
   display: inline-flex;
   align-items: center;
   gap: .5rem;
   margin-top: .8rem;
   font-size: .95rem;
   color: var(--accent);
}

.more svg {
   transition: transform .15s;
}

.more:hover svg {
   transform: translateX(3px);
}

.no-results {
   margin: 2rem 0 4rem;
   color: var(--muted);
}

@media (max-width: 760px) {
   html {
      font-size: 17px;
   }

   .site-nav {
      gap: 1.3rem;
   }

   .post {
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
      padding: 1.8rem 0;
   }

   .post h2 {
      font-size: 1.5rem;
   }
}

@media (max-width: 420px) {
   .brand {
      font-size: 1.25rem;
   }

   .site-nav {
      gap: 1rem;
   }
}

  </style>
  <title>Blog</title>
</head>

<body>
   <header class="site-header">
      <div class="wrap">
         <a class="brand" href="/">Thomas Ahle</a>
         <nav class="site-nav" aria-label="Site">
            <a href="/">Home</a>
            <a href="/blog/" aria-current="page">Blog</a>
            <button class="search-toggle" id="search-toggle" type="button" aria-label="Search posts" aria-expanded="false" aria-controls="search-bar">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
            </button>
         </nav>
      </div>
      <div class="search-bar" id="search-bar" hidden>
         <div class="wrap">
            <input id="search" type="search" placeholder="Search posts" aria-label="Search posts" autocomplete="off">
         </div>
      </div>
   </header>

   <main class="wrap">
      <h1>{{ header_title }}</h1>

      <div class="posts">
         {% for post in posts %}
         <article class="post">
            <a class="thumb" href="{{ post.url }}" tabindex="-1" aria-hidden="true">
               <img src="{{ post.img }}" alt="" loading="{{ 'eager' if loop.index <= 2 else 'lazy' }}">
            </a>
            <div class="body">
               {% if post.category %}<p class="category">{{ post.category }}</p>{% endif %}
               <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
               <p class="meta"><time datetime="{{ post.date }}">{{ post.date }}</time><span class="sep">&middot;</span>{{ post.read_time }} min</p>
               <p class="lead">{{ post.lead }}</p>
               <a class="more" href="{{ post.url }}" aria-label="Read {{ post.title }}">Read more
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
               </a>
            </div>
         </article>
         {% endfor %}
      </div>
      <p class="no-results" id="no-results" hidden>No posts match your search.</p>
   </main>

   <script>
(function () {
   var toggle = document.getElementById('search-toggle');
   var bar = document.getElementById('search-bar');
   var input = document.getElementById('search');
   var empty = document.getElementById('no-results');
   var posts = Array.prototype.slice.call(document.querySelectorAll('.post'));

   function filter() {
      var q = input.value.trim().toLowerCase();
      var shown = 0;
      posts.forEach(function (post) {
         var hit = !q || post.textContent.toLowerCase().indexOf(q) !== -1;
         post.hidden = !hit;
         if (hit) shown++;
      });
      empty.hidden = shown > 0;
   }

   toggle.addEventListener('click', function () {
      bar.hidden = !bar.hidden;
      toggle.setAttribute('aria-expanded', String(!bar.hidden));
      if (bar.hidden) {
         input.value = '';
         filter();
      } else {
         input.focus();
      }
   });
   input.addEventListener('input', filter);
   input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toggle.click();
   });
})();
   </script>
</body>
</html>
