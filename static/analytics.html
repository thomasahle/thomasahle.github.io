<!-- Google Analytics (GA4). Besides the standard page_view this records the full
     referrer, its host, the landing page with query string, and any ?ref= tag
     as event parameters. Register them in GA4 as event-scoped custom
     dimensions (full_referrer, referrer_host, landing_page, ref_tag) to see them.
     This file is the single source of truth: templates include it, and the
     standalone pages under blog/ and 404.html carry an inlined copy. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-40XB6Q54CE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-40XB6Q54CE', (function () {
    var ref = document.referrer || '';
    var host = '';
    if (ref) {
      // android-app:// and other odd schemes may not parse; fall back to the raw string.
      try { host = new URL(ref).hostname || ref; } catch (e) { host = ref; }
    }
    var params = {
      full_referrer: ref || '(direct)',
      referrer_host: host || '(direct)',
      landing_page: location.pathname + location.search
    };
    var tag = new URLSearchParams(location.search).get('ref');
    if (tag) { params.ref_tag = tag; }
    return params;
  })());
</script>
