<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1314" viewBox="0 0 340 1314" role="img" aria-labelledby="title desc">
<title id="title">Hash robustness: colliding inputs and affected keys</title>
<desc id="desc">Hash robustness has two dimensions: how many inputs collide, and which keys make them collide. Rows are one fixed pair and a large fixed set. Columns are a fraction of keys and every key. The four cells show pair-wise collisions, seed-independent pairs, weak-key multicollisions, and seed-independent multicollisions. Few-way collisions sit between the rows. All inputs discussed here are chosen without knowing the secret key.</desc>
<rect width="340" height="1314" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="0" y="20">COLLIDING INPUTS × AFFECTED KEYS</tspan></text>
<text font-size="20" fill="#263330" font-weight="700" text-anchor="start"><tspan x="0" y="56">One fixed pair</tspan></text>
<text font-size="16" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="0" y="91">For a fraction of keys</tspan></text>
<g class="robustness-cell" data-category="Pair-wise collision">
<rect x="0" y="109" width="340" height="206" rx="7" fill="#faf7ef"/>
<path d="M 18 109 H 322" stroke="#866528" stroke-width="3"/>
<text font-size="19" fill="#866528" font-weight="700" text-anchor="start"><tspan x="18" y="137">Pair-wise collision</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="164">The same two inputs collide for some</tspan>
<tspan x="18" y="185">keys.</tspan></text>
<path d="M 18 207 H 322" stroke="#866528" stroke-opacity=".2"/>
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="18" y="226">Applications</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="251">Fingerprinting, hash-based equality,</tspan>
<tspan x="18" y="272">deduplication, approximate membership</tspan>
<tspan x="18" y="293">filters.</tspan></text>
</g>
<text font-size="16" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="0" y="347">For every key</tspan></text>
<g class="robustness-cell" data-category="Seed-independent pair">
<rect x="0" y="365" width="340" height="206" rx="7" fill="#fbf4ef"/>
<path d="M 18 365 H 322" stroke="#a45d37" stroke-width="3"/>
<text font-size="19" fill="#a45d37" font-weight="700" text-anchor="start"><tspan x="18" y="393">Seed-independent pair</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="420">The same two distinct inputs collide</tspan>
<tspan x="18" y="441">for every key.</tspan></text>
<path d="M 18 463 H 322" stroke="#a45d37" stroke-opacity=".2"/>
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="18" y="482">Applications</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="507">Fingerprinting, hash-based equality,</tspan>
<tspan x="18" y="528">deduplication, approximate membership</tspan>
<tspan x="18" y="549">filters.</tspan></text>
</g>
<text font-size="16" fill="#263330" font-weight="700" text-anchor="start"><tspan x="18" y="603">Few-way collisions</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="628">A small set collides for some keys.</tspan></text>
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="18" y="661">Applications</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="686">Cuckoo hashing, bounded-capacity</tspan>
<tspan x="18" y="707">buckets, hash-indexed caches and</tspan>
<tspan x="18" y="728">hardware tables.</tspan></text>
<text font-size="20" fill="#263330" font-weight="700" text-anchor="start"><tspan x="0" y="785">A large fixed set</tspan></text>
<text font-size="16" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="0" y="820">For a fraction of keys</tspan></text>
<g class="robustness-cell" data-category="Weak-key multicollision">
<rect x="0" y="838" width="340" height="185" rx="7" fill="#fbf4ef"/>
<path d="M 18 838 H 322" stroke="#a45d37" stroke-width="3"/>
<text font-size="19" fill="#a45d37" font-weight="700" text-anchor="start"><tspan x="18" y="866">Weak-key multicollision</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="893">A large fixed set collides for a</tspan>
<tspan x="18" y="914">fraction of keys.</tspan></text>
<path d="M 18 936 H 322" stroke="#a45d37" stroke-opacity=".2"/>
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="18" y="955">Applications</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="980">Randomized dictionaries, long-lived</tspan>
<tspan x="18" y="1001">caches, hash-based partitioning.</tspan></text>
</g>
<text font-size="16" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="0" y="1055">For every key</tspan></text>
<g class="robustness-cell" data-category="Seed-independent multicollisions">
<rect x="0" y="1073" width="340" height="229" rx="7" fill="#fcf0f1"/>
<path d="M 18 1073 H 322" stroke="#ad3640" stroke-width="3"/>
<text font-size="19" fill="#ad3640" font-weight="700" text-anchor="start"><tspan x="18" y="1101">Seed-independent</tspan>
<tspan x="18" y="1124">multicollisions</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="1151">A large fixed set collides for every</tspan>
<tspan x="18" y="1172">key.</tspan></text>
<path d="M 18 1194 H 322" stroke="#ad3640" stroke-opacity=".2"/>
<text font-size="13" fill="#626e69" font-weight="700" text-anchor="start"><tspan x="18" y="1213">Applications</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="18" y="1238">Maps and sets, hash-based database</tspan>
<tspan x="18" y="1259">operations, sharding, distinct-count</tspan>
<tspan x="18" y="1280">sketches.</tspan></text>
</g>
</g>
</svg>
