<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="186" viewBox="0 0 1000 186" role="img" aria-labelledby="title desc">
<title id="title">Hash robustness: colliding inputs and affected keys</title>
<desc id="desc">Four categories of hash robustness issues, shown side by side: seed-independent pairs, few-way collisions, weak-key multicollisions, and seed-independent multicollisions. Each category has a short definition and its most directly relevant applications. All inputs discussed here are chosen without knowing the secret key.</desc>
<rect width="1000" height="186" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<g class="robustness-cell" data-category="Seed-independent pair">
<rect x="0.0" y="0" width="241.0" height="186" rx="5" fill="#faf7f0"/>
<text font-size="18" fill="#866528" font-weight="700" text-anchor="start"><tspan x="12.0" y="28">Seed-independent pair</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="12.0" y="51">The same two distinct inputs</tspan>
<tspan x="12.0" y="72">collide for every key.</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="12.0" y="101">Use for: Fingerprinting,</tspan>
<tspan x="12.0" y="122">hash-based equality,</tspan>
<tspan x="12.0" y="143">deduplication, approximate</tspan>
<tspan x="12.0" y="164">membership filters.</tspan></text>
</g>
<g class="robustness-cell" data-category="Few-way collisions">
<rect x="253.0" y="0" width="241.0" height="186" rx="5" fill="#fcf6ee"/>
<text font-size="18" fill="#9a612f" font-weight="700" text-anchor="start"><tspan x="265.0" y="28">Few-way collisions</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="265.0" y="51">A small set collides for</tspan>
<tspan x="265.0" y="72">some keys.</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="265.0" y="101">Use for: Cuckoo hashing,</tspan>
<tspan x="265.0" y="122">bounded-capacity buckets,</tspan>
<tspan x="265.0" y="143">hash-indexed caches and</tspan>
<tspan x="265.0" y="164">hardware tables.</tspan></text>
</g>
<g class="robustness-cell" data-category="Weak-key multicollision">
<rect x="506.0" y="0" width="241.0" height="186" rx="5" fill="#fcf4ef"/>
<text font-size="18" fill="#b34d33" font-weight="700" text-anchor="start"><tspan x="518.0" y="28">Weak-key multicollision</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="518.0" y="51">A large fixed set collides</tspan>
<tspan x="518.0" y="72">for a fraction of keys.</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="518.0" y="101">Use for: Randomized</tspan>
<tspan x="518.0" y="122">dictionaries, long-lived</tspan>
<tspan x="518.0" y="143">caches, hash-based</tspan>
<tspan x="518.0" y="164">partitioning.</tspan></text>
</g>
<g class="robustness-cell" data-category="Multicollisions">
<rect x="759.0" y="0" width="241.0" height="186" rx="5" fill="#fcf1f2"/>
<text font-size="18" fill="#ad3640" font-weight="700" text-anchor="start"><tspan x="771.0" y="28">Multicollisions</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="771.0" y="51">A large fixed set collides</tspan>
<tspan x="771.0" y="72">for every key.</tspan></text>
<text font-size="15" fill="#263330" font-weight="400" text-anchor="start"><tspan x="771.0" y="101">Use for: Maps and sets,</tspan>
<tspan x="771.0" y="122">hash-based database</tspan>
<tspan x="771.0" y="143">operations, sharding,</tspan>
<tspan x="771.0" y="164">distinct-count sketches.</tspan></text>
</g>
</g>
</svg>
